version: '3.0'

services:
  # ==========================================
  # 1. PostgreSQL
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: weather-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weather-network

  # ==========================================
  # 2. Ваше приложение
  # ==========================================
  weather-parser:
    build: .
    container_name: weather-parser
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      CITY: ${CITY:-Volgograd}
      INTERVAL: ${INTERVAL:-30s}
      AUTO_DETECT: ${AUTO_DETECT:-false}
      CSV_PATH: ${CSV_PATH:-/app/data/weather_data.csv}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      DB_ENABLED: ${DB_ENABLED:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: weather
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    ports:
      - "8080:8080"
    networks:
      - weather-network

# ==========================================
# ОБЪЯВЛЕНИЯ
# ==========================================
volumes:
  postgres_data: {}

networks:
  weather-network: {}